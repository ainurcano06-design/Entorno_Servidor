<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de alumnado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Registrar nuevo alumno</h2>

<form action="insertar.php" method="POST">
    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <label>Apellidos:</label>
    <input type="text" name="apellidos" required>

    <label>Fecha de nacimiento:</label>
    <input type="date" name="fecha_nacimiento" required>

    <label>Curso:</label>
    <select name="curso" required>
        <option value="1ESO">1º ESO</option>
        <option value="2ESO">2º ESO</option>
        <option value="3ESO">3º ESO</option>
        <option value="4ESO">4º ESO</option>
    </select>

    <label>Email educamos:</label>
    <input type="email" name="email" required>

    <label>Contraseña educamos:</label>
    <input type="password" name="password" required>

    <button type="submit">Registrar</button>
</form>

<hr>

<h2>Listado de alumnado</h2>

<iframe src="listar.php" width="100%" height="400" style="border:none;"></iframe>

</body>
</html>
